name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Four independent jobs: a model-quality regression fails baseline-check on its own,
# even when lint, tests and the Docker build pass. None of them needs mlflow.db, mlruns,
# a registry champion, feedback files, an exported model or secrets.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.30"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.30"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest

  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.30"
          python-version: "3.13"
      - run: uv sync --frozen
      # Fresh train-split-only fit gated against the committed config/baseline_metrics.json.
      - run: uv run python -m ai4i_mlops.baseline_check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ai4i-mlops:ci .
