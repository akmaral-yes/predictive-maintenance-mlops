[project]
name = "predictive-maintenance-mlops"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "ucimlrepo>=0.0.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai4i_mlops"]